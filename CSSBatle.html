<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2026</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
        }

        header {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
        }

        header h1 {
            font-size: 4rem;
            color: #ffffff;
        }

        header p {
            margin-top: 20px;
            font-size: 1.2rem;
            max-width: 700px;
            color: #cbd5e1;
        }

        .botao {
            margin-top: 30px;
            background: #38bdf8;
            color: black;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: .3s;
        }

        .botao:hover {
            transform: scale(1.05);
        }

        section {
            padding: 60px 10%;
        }

        .titulo {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
        }

        .regras {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .regra {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
        }

        .regra h3 {
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .desafios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: #1e293b;
            border-radius: 20px;
            overflow: hidden;
            transition: .3s;
            
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .imagem {
            height: 280px;
            background: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        .conteudo {
            padding: 20px;
        }

        .conteudo h3 {
            margin-bottom: 10px;
        }

        .pontos {
            color: #38bdf8;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 50px;
            background: #020617;
            margin-top: 50px;
        }

        .ranking {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .posicao {
            background: #1e293b;
            width: 250px;
            padding: 25px;
            border-radius: 15px;
        }
    </style>
</head>
